<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoNet ShakeMap — seismic waves across Aotearoa</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <div class="title-main">
          <h1>GeoNet ShakeMap</h1>
          <p id="event-name">Loading…</p>
        </div>
        <div class="title-meta">
          <div class="picker">
            <label class="control-label" for="event-select">Earthquake</label>
            <select id="event-select" aria-label="Choose earthquake"></select>
          </div>
          <span id="sensor-count"></span>
        </div>
      </header>

      <main id="stage">
        <canvas id="map"></canvas>
        <div id="clock-readout" aria-live="off">
          <span id="time-origin">—</span>
          <span id="time-utc"></span>
        </div>
        <div id="legend">
          <span class="legend-item"><span class="glyph solid"></span> ground moving up (+)</span>
          <span class="legend-item"><span class="glyph hollow"></span> ground moving down (−)</span>
          <span class="legend-item"><span class="glyph epi"></span> epicentre</span>
        </div>
      </main>

      <section id="trace-strip">
        <button id="play" type="button" aria-label="Play or pause">▶</button>
        <div id="trace-wrap">
          <canvas
            id="trace"
            tabindex="0"
            role="slider"
            aria-label="Timeline — network shaking"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ></canvas>
        </div>
      </section>

      <section id="controls">
        <div class="control-group">
          <label class="control-label">Speed</label>
          <div id="speed-buttons" role="group" aria-label="Playback speed"></div>
        </div>

        <div class="control-group">
          <label class="control-label" for="loop-toggle">Loop</label>
          <input id="loop-toggle" type="checkbox" checked />
        </div>

        <div class="control-group">
          <label class="control-label" for="norm-toggle">Normalise</label>
          <select id="norm-toggle" aria-label="Amplitude normalisation">
            <option value="per-station">per station</option>
            <option value="uniform">uniform</option>
          </select>
        </div>

        <div class="control-group trace-caption">
          <span>Bottom trace: network-wide shaking over time — click or drag to scrub</span>
        </div>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
